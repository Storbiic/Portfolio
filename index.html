<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply the saved or system theme before first paint, so there's no flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved === "dark" || ((!saved || saved === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <title>Saad Najar - Data Scientist & AI Engineer Portfolio</title>
    <meta name="description" content="Portfolio of Saad Najar, a skilled Data Scientist and AI Engineer specializing in machine learning, deep learning, and data analytics." />
    <meta name="author" content="Saad Najar" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter is only fetched where the system font (SF Pro) is unavailable.
         Instrument Serif sets accent words; Geist Mono sets labels. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

    <meta property="og:title" content="Saad Najar - Data Scientist & AI Engineer" />
    <meta property="og:description" content="Portfolio showcasing AI engineering and data science projects" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
